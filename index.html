      /* Custom scrollbar for cleaner look */
      ::-webkit-scrollbar {
        width: 8px;

      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;

      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
      .a4-paper {
        width: 210mm;
        min-height: 297mm;
        background: white;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
      }
      .resume-section {
        orphans: 3;
        widows: 3;
      }
      @media print {
        body {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        body * {
          visibility: hidden;
        }
        .print-area, .print-area * {
          visibility: visible;
        }
        .print-area {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          margin: 0 !important;
          padding: 0 !important;
          box-shadow: none !important;
          transform: none !important;
        }
        /* Hide scrollbars in print */
        ::-webkit-scrollbar {
          display: none;
        }
